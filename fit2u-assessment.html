<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FIT2U · Nutrition Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a0a0a;
    --panel:#141414;
    --panel-2:#191919;
    --line:#2a2a2a;
    --red:#e2231a;
    --red-dim:#7a130d;
    --text:#f2f2f0;
    --muted:#9c9a96;
    --muted-2:#6f6d6a;
    --ok:#3fae5c;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--text);}
  body{
    font-family:'Inter',system-ui,sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.brand,.section-title,.big-label{font-family:'Oswald',sans-serif;}
  a{color:var(--red);}
  .wrap{max-width:760px;margin:0 auto;padding:28px 20px 80px;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:16px 20px;border-bottom:1px solid var(--line);
    position:sticky;top:0;background:rgba(10,10,10,.92);backdrop-filter:blur(6px);
    z-index:20;
  }
  .brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:19px;letter-spacing:.3px;}
  .brand .dot{width:9px;height:9px;background:var(--red);border-radius:50%;display:inline-block;}
  .brand small{display:block;font-family:'Inter';font-weight:500;font-size:10.5px;color:var(--muted-2);letter-spacing:.14em;margin-top:1px;}
  .tag{font-size:12px;color:var(--muted);border:1px solid var(--line);padding:4px 10px;border-radius:999px;}

  .hero{padding:38px 0 8px;}
  .hero h1{font-size:34px;line-height:1.08;margin:0 0 10px;font-weight:600;}
  .hero h1 em{font-style:normal;color:var(--red);}
  .hero p{color:var(--muted);font-size:15.5px;margin:0 0 26px;max-width:56ch;}

  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:22px 22px 24px;margin-bottom:18px;
  }
  .choice-card{
    display:flex;gap:16px;align-items:flex-start;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    padding:20px;margin-bottom:14px;transition:border-color .15s ease, background .15s ease;
    text-align:left;width:100%;color:var(--text);font-family:inherit;
  }
  .choice-card:hover{border-color:var(--red);background:var(--panel-2);}
  .choice-card .num{
    flex:none;width:34px;height:34px;border-radius:8px;background:var(--red);
    display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:600;font-size:15px;
  }
  .choice-card h3{margin:0 0 4px;font-size:16.5px;font-weight:600;}
  .choice-card p{margin:0;font-size:13.5px;color:var(--muted);}

  .section{
    background:var(--panel);border:1px solid var(--line);border-radius:10px;
    margin-bottom:16px;overflow:hidden;
  }
  .section-head{
    display:flex;align-items:center;gap:12px;padding:14px 18px;
    background:var(--red);
  }
  .section-head .n{
    flex:none;width:26px;height:26px;border-radius:6px;background:rgba(0,0,0,.28);
    display:flex;align-items:center;justify-content:center;font-family:'Oswald';font-weight:600;font-size:13px;color:#fff;
  }
  .section-head h2{margin:0;font-size:15px;letter-spacing:.03em;font-weight:600;color:#fff;text-transform:uppercase;}
  .section-body{padding:20px 18px 8px;}

  .field{margin-bottom:16px;}
  .field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px;font-weight:500;}
  .field .hint{font-size:12px;color:var(--muted-2);margin-top:5px;}
  input[type=text],input[type=number],input[type=date],input[type=tel],input[type=email],select,textarea{
    width:100%;background:#0d0d0d;border:1px solid var(--line);color:var(--text);
    padding:10px 12px;border-radius:7px;font-size:14.5px;font-family:inherit;
  }
  textarea{resize:vertical;min-height:70px;}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--red);}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;}
  @media (max-width:560px){.row2,.row3{grid-template-columns:1fr;}}

  .choices{display:flex;gap:8px;flex-wrap:wrap;}
  .choices label{
    display:flex;align-items:center;gap:7px;background:#0d0d0d;border:1px solid var(--line);
    padding:8px 13px;border-radius:7px;font-size:13.5px;color:var(--text);cursor:pointer;margin:0;font-weight:400;
  }
  .choices input{width:auto;accent-color:var(--red);}
  .yn{display:flex;gap:8px;}
  .yn label{
    display:flex;align-items:center;gap:6px;background:#0d0d0d;border:1px solid var(--line);
    padding:8px 16px;border-radius:7px;font-size:13.5px;cursor:pointer;margin:0;
  }
  .yn input{accent-color:var(--red);}

  table{width:100%;border-collapse:collapse;margin-top:4px;}
  th,td{border:1px solid var(--line);padding:8px;text-align:left;font-size:13px;vertical-align:top;}
  th{background:#0d0d0d;color:var(--muted);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em;}
  td input{border:none;background:transparent;padding:4px 2px;font-size:13.5px;}
  td input:focus{outline:1px solid var(--red);border-radius:4px;}
  .foodtable td:first-child{font-weight:600;color:var(--muted);white-space:nowrap;font-size:12.5px;}

  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:8px;
    background:var(--red);color:#fff;border:none;padding:13px 22px;border-radius:8px;
    font-size:14.5px;font-weight:600;cursor:pointer;font-family:'Inter';
  }
  .btn:hover{background:#c91e16;}
  .btn.secondary{background:transparent;border:1px solid var(--line);color:var(--text);}
  .btn.secondary:hover{border-color:var(--red);}
  .btn.ghost{background:transparent;color:var(--muted);padding:8px 4px;text-decoration:underline;}
  .btn.whatsapp{background:#25D366;color:#06280f;}
  .btn.whatsapp:hover{background:#1fbd5a;}
  .btn.whatsapp svg{width:18px;height:18px;flex:none;}
  .btn:disabled{opacity:.5;cursor:default;}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:8px;flex-wrap:wrap;}
  .actions.left{justify-content:flex-start;}

  .status-pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);color:var(--muted);}
  .status-pill.done{color:var(--ok);border-color:var(--ok);}
  .status-pill .dotp{width:6px;height:6px;border-radius:50%;background:currentColor;}

  .linkbox{
    display:flex;gap:8px;align-items:center;background:#0d0d0d;border:1px solid var(--line);
    border-radius:8px;padding:10px 12px;margin:14px 0;
  }
  .linkbox input{border:none;background:transparent;color:var(--muted);font-size:12.5px;padding:2px;}
  .copied{color:var(--ok);font-size:12.5px;font-weight:600;}

  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px 24px;font-size:13.5px;}
  @media (max-width:560px){.summary-grid{grid-template-columns:1fr;}}
  .summary-grid .k{color:var(--muted-2);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;}
  .summary-grid .v{margin-top:2px;}
  .kv{margin-bottom:12px;}

  .note{
    background:#1c1108;border:1px solid #4a2c10;color:#e8b98a;
    padding:12px 14px;border-radius:8px;font-size:13px;margin-bottom:18px;
  }
  .rec-list{margin:0;padding-left:18px;}
  .rec-list li{margin-bottom:5px;font-size:14px;}

  footer.foot{text-align:center;color:var(--muted-2);font-size:12px;padding:30px 0 10px;}

  .hidden{display:none !important;}

  @media print{
    .topbar,.actions,.no-print{display:none !important;}
    body{background:#fff;color:#000;}
    .card,.section{background:#fff;border-color:#ccc;}
    .section-head{background:#e2231a !important;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    input,select,textarea{color:#000;border-color:#ccc;background:#fff;}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <span class="dot"></span>
    <div>FIT2U<small>PERSONAL TRAINING AT YOUR DOORSTEP</small></div>
  </div>
  <div class="tag" id="topStatus">Nutrition Assessment</div>
</div>

<div class="wrap" id="app"></div>

<footer class="foot">FIT2U · Nutrition Assessment Sheet · fit2u.ae</footer>

<script>
(function(){

/* ---------- state helpers ---------- */
function encodeState(obj){
  return btoa(unescape(encodeURIComponent(JSON.stringify(obj)))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function decodeState(str){
  try{
    str = str.replace(/-/g,'+').replace(/_/g,'/');
    while(str.length % 4) str += '=';
    return JSON.parse(decodeURIComponent(escape(atob(str))));
  }catch(e){ return null; }
}
function readState(){
  var h = location.hash.replace(/^#/,'');
  if(!h) return null;
  return decodeState(h);
}
function writeState(state, screen){
  location.hash = encodeState(state);
  if(screen) render(screen, state);
}
function uid(){ return Math.random().toString(36).slice(2,9); }

/* ---------- WhatsApp helpers ---------- */
var TRAINER_WA = '971568841476'; // FIT2U trainer WhatsApp number, digits only, country code first
function formatPhoneForWa(raw){
  if(!raw) return '';
  var digits = raw.replace(/[^\d+]/g,'');
  if(digits.charAt(0) === '+'){ digits = digits.slice(1); }
  else{
    digits = digits.replace(/^0+/,'');
    if(digits.length <= 10) digits = '971' + digits; // assume UAE if no country code given
  }
  return digits;
}
function waLink(phoneDigits, message){
  return 'https://wa.me/' + phoneDigits + '?text=' + encodeURIComponent(message);
}
function openWa(href){
  try{ var w = window.open(href, '_blank'); if(!w){ return false; } return true; }catch(e){ return false; }
}
function fmtDate(iso){
  if(!iso) return '';
  var d = new Date(iso);
  if(isNaN(d)) return iso;
  return d.toLocaleDateString(undefined,{year:'numeric',month:'short',day:'numeric'});
}
function esc(s){
  if(s===undefined||s===null) return '';
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function nl2li(s){
  if(!s) return '<li style="color:var(--muted-2)">Not specified</li>';
  return s.split('\n').map(function(l){ l=l.trim(); return l ? '<li>'+esc(l)+'</li>' : ''; }).join('');
}
function yn(v){ return v==='yes' ? 'Yes' : (v==='no' ? 'No' : '—'); }

var app = document.getElementById('app');
var topStatus = document.getElementById('topStatus');

/* ---------- field collectors ---------- */
function val(id){ var el=document.getElementById(id); return el ? el.value.trim() : ''; }
function radioVal(name){
  var els = document.getElementsByName(name);
  for(var i=0;i<els.length;i++){ if(els[i].checked) return els[i].value; }
  return '';
}
function setVal(id, v){ var el=document.getElementById(id); if(el && v!==undefined) el.value = v; }
function setRadio(name, v){
  var els = document.getElementsByName(name);
  for(var i=0;i<els.length;i++){ if(els[i].value === v) els[i].checked = true; }
}

/* ============================================================
   SCREEN: LANDING (no data yet)
   ============================================================ */
function screenLanding(){
  topStatus.textContent = 'New assessment';
  app.innerHTML =
    '<div class="hero">'+
      '<h1>Nutrition <em>Assessment</em></h1>'+
      '<p>A two-part intake: you fill in your details first, then send the link to your trainer to complete the professional assessment and get your personalised plan.</p>'+
      '<button class="btn" id="startBtn">Start My Assessment</button>'+
    '</div>';
  document.getElementById('startBtn').onclick = function(){
    render('clientForm', null);
  };
}

/* ============================================================
   SCREEN: CLIENT FORM (part 1)
   ============================================================ */
function screenClientForm(existing){
  var c = (existing && existing.client) || {};
  topStatus.textContent = 'Part 1 of 2 · Client';
  app.innerHTML =
    '<div class="hero" style="padding-top:20px;">'+
      '<h1 style="font-size:26px;">Part 1 · <em>Your Details</em></h1>'+
      '<p>Answer honestly — this is what your trainer uses to build a plan that actually fits your life.</p>'+
    '</div>'+

    section(1,'Client Information',
      '<div class="row2">'+
        field('Full Name','text','f_fullName')+
        field('Date','date','f_date')+
      '</div>'+
      '<div class="row2">'+
        field('Age','number','f_age')+
        '<div class="field"><label>Gender</label><div class="choices">'+
          radioChoice('f_gender','Male')+radioChoice('f_gender','Female')+radioChoice('f_gender','Other')+
        '</div></div>'+
      '</div>'+
      '<div class="row2">'+
        '<div class="field"><label>Phone (WhatsApp, with country code)</label><input type="tel" id="f_phone" placeholder="+971 50 123 4567"><div class="hint">Used to send your trainer\'s plan back to you on WhatsApp.</div></div>'+
        field('Email','email','f_email')+
      '</div>'+
      field('Occupation','text','f_occupation')+
      field('Address','text','f_address')+
      field('Emergency Contact','text','f_emergency')
    )+

    section(2,'Your Primary Goal',
      '<div class="field"><label>Primary Goal</label><div class="choices">'+
        radioChoice('f_goal','Fat Loss')+radioChoice('f_goal','Muscle Gain')+radioChoice('f_goal','Weight Maintenance')+
        radioChoice('f_goal','Improve Performance')+radioChoice('f_goal','Improve Health')+radioChoice('f_goal','Other')+
      '</div></div>'+
      field('If Other, please specify','text','f_goalOther')+
      '<div class="row3">'+
        field('Target Weight','text','f_targetWeight','e.g. 68 kg')+
        field('Target Body Fat %','text','f_targetBodyFat')+
        field('Target Date','date','f_targetDate')+
      '</div>'+
      field('What does success look like for you?','textarea','f_success')
    )+

    section(3,'Health &amp; Medical History',
      ynBlock('Do you have any medical conditions?','f_medConditions','f_medConditionsDetail')+
      ynBlock('Are you currently on any medication or supplements?','f_meds','f_medsDetail')+
      ynBlock('Any allergies or food intolerances?','f_allergies','f_allergiesDetail')+
      ynBlock('Any surgeries or injuries (past or present)?','f_injuries','f_injuriesDetail')+
      ynBlock('Family history of any health conditions?','f_familyHistory','f_familyHistoryDetail')
    )+

    section(4,'Lifestyle Assessment',
      '<div class="row3">'+
        field('Sleep Duration','text','f_sleepHours','hrs/night')+
        selectField('Sleep Quality','f_sleepQuality',['Poor','Fair','Good'])+
        selectField('Stress Level','f_stressLevel',['Low','Moderate','High'])+
      '</div>'+
      '<div class="row2">'+
        selectField('Work Schedule','f_workSchedule',['Desk Job','Active Job','Shift Work','Other'])+
        field('Daily Steps (avg)','number','f_dailySteps')+
      '</div>'+
      '<div class="row2">'+
        field('Screen Time (avg)','text','f_screenTime','hrs/day')+
        selectField('Physical Activity Level','f_activityLevel',['Sedentary (little/no exercise)','Lightly Active (1–3 days/wk)','Moderately Active (3–5 days/wk)','Very Active (6–7 days/wk)','Extra Active (2x/day or intense)'])+
      '</div>'+
      '<div class="row2">'+
        field('Bowel Movement Frequency','text','f_bowelFreq','times/day or week')+
        selectField('Consistency (Bristol Chart)','f_bowelConsistency',['1','2','3','4','5','6','7'])+
      '</div>'+
      ynBlock('Any digestive issues? (bloating, constipation, diarrhoea, etc.)','f_digestive','f_digestiveDetail')+
      '<div class="row2">'+
        field('Hydration (Water Intake)','text','f_water','L/day')+
        selectField('Alcohol Intake','f_alcohol',['None','Rarely','Occasionally','Regularly'])+
      '</div>'+
      ynBlock('Do you smoke?','f_smoking','f_smokingFreq','If yes, how often?')
    )+

    section(5,'Eating Habits',
      '<div class="row2">'+
        field('How many meals do you eat per day?','number','f_meals')+
        field('Who prepares most of your meals?','text','f_mealsBy')+
      '</div>'+
      ynBlock('Do you snack between meals?','f_snack')+
      ynBlock('Do you follow any specific diet?','f_diet','f_dietDetail')+
      ynBlock('Do you count calories or macros?','f_countMacros')+
      field('How often do you eat out?','text','f_eatOut')+
      ynBlock('Cravings / emotional eating?','f_emotionalEating','f_emotionalEatingDetail','If yes, please specify triggers')+
      field('What are your biggest barriers to eating healthy?','textarea','f_barriers')
    )+

    section(6,'24-Hour Food Recall', foodRecallTable(c.foodRecall));

  app.innerHTML += '<div class="actions"><button class="btn secondary" id="cancelBtn">Back</button><button class="btn" id="submitClientBtn">Save &amp; Get Link for Trainer</button></div>';

  // prefill
  ['fullName','date','age','phone','email','occupation','address','emergency',
   'goalOther','targetWeight','targetBodyFat','targetDate','success',
   'medConditionsDetail','medsDetail','allergiesDetail','injuriesDetail','familyHistoryDetail',
   'sleepHours','dailySteps','screenTime','bowelFreq','digestiveDetail','water','smokingFreq',
   'meals','mealsBy','dietDetail','eatOut','emotionalEatingDetail','barriers'
  ].forEach(function(k){ setVal('f_'+k, c[k]); });
  ['sleepQuality','stressLevel','workSchedule','activityLevel','bowelConsistency','alcohol'].forEach(function(k){
    setVal('f_'+k, c[k]);
  });
  ['gender','goal','medConditions','meds','allergies','injuries','familyHistory','digestive','smoking',
   'snack','diet','countMacros','emotionalEating'].forEach(function(k){
    if(c[k]) setRadio('f_'+k, c[k]);
  });
  fillFoodTable(c.foodRecall);

  document.getElementById('cancelBtn').onclick = function(){
    if(existing) render('landingFromHash', existing); else render('landing', null);
  };
  document.getElementById('submitClientBtn').onclick = function(){
    var client = collectClient();
    var state = {
      meta: (existing && existing.meta) || { id: uid(), createdAt: new Date().toISOString() },
      client: client,
      trainer: (existing && existing.trainer) || null
    };
    state.meta.clientSubmittedAt = new Date().toISOString();
    writeState(state, 'clientShareLink');
  };
}

function collectClient(){
  var c = {};
  ['fullName','date','age','phone','email','occupation','address','emergency',
   'goalOther','targetWeight','targetBodyFat','targetDate','success',
   'medConditionsDetail','medsDetail','allergiesDetail','injuriesDetail','familyHistoryDetail',
   'sleepHours','dailySteps','screenTime','bowelFreq','digestiveDetail','water','smokingFreq',
   'meals','mealsBy','dietDetail','eatOut','emotionalEatingDetail','barriers'
  ].forEach(function(k){ c[k] = val('f_'+k); });
  ['sleepQuality','stressLevel','workSchedule','activityLevel','bowelConsistency','alcohol'].forEach(function(k){
    c[k] = val('f_'+k);
  });
  ['gender','goal','medConditions','meds','allergies','injuries','familyHistory','digestive','smoking',
   'snack','diet','countMacros','emotionalEating'].forEach(function(k){
    c[k] = radioVal('f_'+k);
  });
  c.emergencyContact = c.emergency;
  c.foodRecall = collectFoodTable();
  return c;
}

var FOOD_ROWS = ['Breakfast','Mid-Morning','Lunch','Afternoon','Dinner','Evening Snack','Beverages'];
function foodRecallTable(existingRows){
  var rows = FOOD_ROWS.map(function(name, i){
    return '<tr>'+
      '<td>'+name+'</td>'+
      '<td><input type="text" id="fr_food_'+i+'" placeholder="Foods &amp; drinks"></td>'+
      '<td><input type="text" id="fr_portion_'+i+'" placeholder="Portion" style="width:80px"></td>'+
      '<td><input type="text" id="fr_cal_'+i+'" placeholder="Cal" style="width:64px"></td>'+
    '</tr>';
  }).join('');
  return '<div style="overflow-x:auto;"><table class="foodtable">'+
    '<tr><th>Meal / Time</th><th>Foods &amp; Drinks</th><th>Portion</th><th>Cal</th></tr>'+
    rows+
    '<tr><td colspan="3" style="text-align:right;font-weight:600;color:var(--muted)">Total (Est.)</td><td><input type="text" id="fr_total" style="width:64px"></td></tr>'+
  '</table></div>';
}
function collectFoodTable(){
  var rows = FOOD_ROWS.map(function(name, i){
    return { meal:name, food: val('fr_food_'+i), portion: val('fr_portion_'+i), cal: val('fr_cal_'+i) };
  });
  return { rows: rows, total: val('fr_total') };
}
function fillFoodTable(fr){
  if(!fr || !fr.rows) return;
  fr.rows.forEach(function(r, i){
    setVal('fr_food_'+i, r.food); setVal('fr_portion_'+i, r.portion); setVal('fr_cal_'+i, r.cal);
  });
  setVal('fr_total', fr.total);
}

/* ---------- small builders ---------- */
function section(n, title, body){
  return '<div class="section"><div class="section-head"><div class="n">'+n+'</div><h2>'+title+'</h2></div><div class="section-body">'+body+'</div></div>';
}
function field(label, type, id, placeholder){
  if(type==='textarea'){
    return '<div class="field"><label>'+label+'</label><textarea id="'+id+'" placeholder="'+(placeholder||'')+'"></textarea></div>';
  }
  return '<div class="field"><label>'+label+'</label><input type="'+type+'" id="'+id+'" placeholder="'+(placeholder||'')+'"></div>';
}
function selectField(label, id, options){
  var opts = '<option value="">Select…</option>' + options.map(function(o){ return '<option value="'+esc(o)+'">'+esc(o)+'</option>'; }).join('');
  return '<div class="field"><label>'+label+'</label><select id="'+id+'">'+opts+'</select></div>';
}
function radioChoice(name, label){
  return '<label><input type="radio" name="'+name+'" value="'+esc(label)+'"> '+label+'</label>';
}
function ynBlock(question, name, detailId, detailLabel){
  var block = '<div class="field"><label>'+question+'</label><div class="yn">'+
    '<label><input type="radio" name="'+name+'" value="yes"> Yes</label>'+

function firstName(full){
  if(!full) return 'there';
  return full.trim().split(' ')[0];
}
function copyLink(inputId, msgId){
  var input = document.getElementById(inputId);
  input.select(); input.setSelectionRange(0,99999);
  var done = function(){ document.getElementById(msgId).classList.remove('hidden'); };
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(input.value).then(done).catch(function(){ try{document.execCommand('copy'); done();}catch(e){} });
  } else {
    try{ document.execCommand('copy'); done(); }catch(e){}
  }
}

/* ============================================================
   ROUTER
   ============================================================ */
function render(screen, state){
  window.scrollTo(0,0);
  if(screen==='landing') return screenLanding();
  if(screen==='clientForm') return screenClientForm(state);
  if(screen==='clientShareLink') return screenClientShareLink(state);
  if(screen==='clientWaiting') return screenClientWaiting(state);
  if(screen==='landingFromHash') return screenLandingFromHash(state);
  if(screen==='trainerForm') return screenTrainerForm(state);
  if(screen==='trainerShareLink') return screenTrainerShareLink(state);
  if(screen==='fullView') return screenFullView(state);
}

function boot(){
  var state = readState();
  if(!state || !state.client){ render('landing', null); return; }
  if(state.client && state.trainer){ render('fullView', state); return; }
  render('landingFromHash', state);
}

window.addEventListener('hashchange', boot);
boot();
